spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

netra:
  security:
    jwt:
      # Mandatory in production. No default fallback. Application fails fast if missing.
      secret: ${JWT_SECRET}
      access-token-validity-ms: 900000 # 15 minutes in production
      refresh-token-validity-ms: 604800000 # 7 days
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1}
