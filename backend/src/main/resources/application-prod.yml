# ==============================================================================
# NETRA Backend — Production Profile Configuration (application-prod.yml)
# ==============================================================================

server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NetraHikariPool
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000
      register-mbeans: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

netra:
  security:
    jwt:
      # Mandatory in production. No default fallback. Application fails fast if missing.
      secret: ${JWT_SECRET}
      access-token-validity-ms: 900000 # 15 minutes in production
      refresh-token-validity-ms: 604800000 # 7 days
    cors:
      # Explicit HTTPS origins injected at deployment time. Wildcards and localhost prohibited.
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    trusted-proxies: ${TRUSTED_PROXIES}

  notifications:
    push:
      # Production requires real FCM push delivery. NOOP is prohibited in prod.
      provider: ${NETRA_PUSH_PROVIDER:fcm}
      fcm:
        project-id: ${FCM_PROJECT_ID:${FIREBASE_PROJECT_ID:}}
        credentials-path: ${FCM_CREDENTIALS_PATH:${FIREBASE_CREDENTIALS_PATH:}}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      roles: ROLE_ADMIN
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-NONE}]"
  level:
    root: INFO
    org.netra: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: INFO
